[platformio]
default_envs = seeed-xiao-nrf52840-relay
build_dir = ../.pio_wio_nrf_build

[env:seeed-xiao-nrf52840-relay]
platform = nordicnrf52
board = seeed_xiao_nrf52840_sense
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_archive = no

build_flags =
    -DSPECTRE_WIO_RELAY_VERSION=\"0.4.0\"
    -DSPECTRE_NRF_AUTO_BLE=1
    -DSPECTRE_WIO_SX1262=1
    ; SX1262 pin map for the XIAO nRF52840 + Wio-SX1262 *kit* (SKU 102010710).
    ; For the 30-pin board-to-board carrier, define SPECTRE_WIO_SX1262_BTB=1
    ; instead (CS=D3, DIO1=D0, BUSY=D1, RESET=D2, RXEN=D4) — see main.cpp.
    -DCFG_DEBUG=0
    -DCFG_LOGGER=0

build_src_filter =
    +<main.cpp>
    -<diag_usb_blink.cpp>

lib_deps =
    adafruit/Adafruit TinyUSB Library
    jgromes/RadioLib @ ^7.0.0

[env:usb-blink-diag]
platform = nordicnrf52
board = seeed_xiao_nrf52840_sense
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_archive = no
build_src_filter =
    -<main.cpp>
    +<diag_usb_blink.cpp>
build_flags =
    -DCFG_DEBUG=0
    -DCFG_LOGGER=0
lib_deps =
    adafruit/Adafruit TinyUSB Library
